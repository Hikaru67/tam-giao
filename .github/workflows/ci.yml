name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Testcontainers dùng Docker có sẵn trên runner; tắt Ryuk để dọn container nhanh hơn trên CI tạm thời.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Chặn lỗ hổng mức high/critical trong dependency chạy production.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee unit-test.log

      - name: Integration tests (Postgres via Testcontainers)
        shell: bash
        run: |
          set -o pipefail
          pnpm test:int 2>&1 | tee int-test.log

      # AGENTS.md mục 5 — không log PII.
      - name: Scan test logs for PII
        run: pnpm --filter @tamgiao/tools scan:pii ../unit-test.log ../int-test.log
