name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Testcontainers dùng Docker có sẵn trên runner; tắt Ryuk để dọn container nhanh hơn trên CI tạm thời.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Chặn lỗ hổng mức high/critical trong dependency chạy production.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee unit-test.log

      # FE-S1-06: build thật app web (admin, partner — partner sinh service worker PWA).
      # FE-S6-03: build production bắt buộc có URL API (vite.config.ts fail sớm) — CI dùng URL giả không phân giải được.
      - name: Build web apps (admin, partner)
        env:
          VITE_API_URL: https://api.ci.tamgiao.invalid
        run: pnpm --filter @tamgiao/admin --filter @tamgiao/partner build

      # FE-S1-06: bundle JS mobile (Metro) — bắt lỗi resolve/import mà typecheck không thấy (vd @tamgiao/contracts `.js`).
      # FE-S6-03: app.config.ts bắt buộc EXPO_PUBLIC_* khi build production; Android xuất JS thường (`--no-bytecode`)
      # để bước quét bundle đọc được chuỗi (Hermes bytecode không quét được), iOS giữ bytecode để vẫn kiểm tra biên dịch Hermes.
      - name: Bundle mobile app (Expo, iOS + Android)
        env:
          EXPO_PUBLIC_API_URL: https://api.ci.tamgiao.invalid
          EXPO_PUBLIC_WS_URL: wss://api.ci.tamgiao.invalid/ws
        run: |
          pnpm --filter @tamgiao/mobile exec expo export --platform ios --output-dir "$RUNNER_TEMP/expo-ios"
          pnpm --filter @tamgiao/mobile exec expo export --platform android --no-bytecode --output-dir "$RUNNER_TEMP/expo-android"

      # FE-S6-03 (AC1): bundle production không được chứa route /dev/, nút thanh toán giả, URL dev, secret mẫu, console.log.
      - name: Scan production bundles
        run: >-
          pnpm --filter @tamgiao/tools scan:bundle --env-example ../.env.example
          ../apps/admin/dist ../apps/partner/dist "$RUNNER_TEMP/expo-android"

      - name: Integration tests (Postgres via Testcontainers)
        shell: bash
        run: |
          set -o pipefail
          pnpm test:int 2>&1 | tee int-test.log

      # AGENTS.md mục 5 — không log PII.
      - name: Scan test logs for PII
        run: pnpm --filter @tamgiao/tools scan:pii ../unit-test.log ../int-test.log
