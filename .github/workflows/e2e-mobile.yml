name: E2E mobile (Maestro)

# FE-S6-01: luồng chính app mobile trên emulator Android + BE local (provider giả). Chạy tay hoặc mỗi đêm.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *' # 02:00 giờ Việt Nam

concurrency:
  group: e2e-mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maestro:
    name: Maestro E2E (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAESTRO_VERSION: 1.41.0
      # Emulator gọi máy host qua 10.0.2.2 (API cổng 3100 do tests/e2e/run-local.sh dựng).
      EXPO_PUBLIC_API_URL: http://10.0.2.2:3100
      EXPO_PUBLIC_WS_URL: ws://10.0.2.2:3100/ws
      E2E_HELPER_PORT: '3199'
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache Gradle để giảm thời gian build APK release trên runner.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local backend
        run: tests/e2e/run-local.sh up

      - name: Prebuild Android project
        env:
          CI: '1'
        run: pnpm --filter @tamgiao/mobile exec expo prebuild --platform android --no-install --clean

      # Chỉ áp dụng cho bản build e2e: BE local dùng HTTP, còn bản release Android mặc định chặn cleartext.
      - name: Allow cleartext HTTP for local E2E
        run: |
          manifest=apps/mobile/android/app/src/main/AndroidManifest.xml
          if grep -q 'android:usesCleartextTraffic=' "$manifest"; then
            sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/' "$manifest"
          else
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$manifest"
          fi
          grep -q 'android:usesCleartextTraffic="true"' "$manifest"

      # Chỉ build kiến trúc x86_64 cho emulator để rút ngắn thời gian biên dịch native.
      - name: Build release APK (x86_64)
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      # Phiên bản Maestro được ghim qua biến môi trường MAESTRO_VERSION của job.
      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Bật KVM để emulator Android x86_64 chạy có tăng tốc phần cứng trên Linux runner.
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro E2E (3 consecutive runs)
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Camera giả của emulator để chụp ảnh eKYC trong app.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: apps/mobile/e2e/run.sh ci apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      # Log chỉ chứa dữ liệu giả (SĐT ngẫu nhiên 09…, không phải người thật).
      - name: Upload E2E logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mobile-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            apps/mobile/e2e/.run/
            tests/e2e/.run/*.log
            ~/.maestro/tests/

      - name: Stop local backend
        if: always()
        run: tests/e2e/run-local.sh down
